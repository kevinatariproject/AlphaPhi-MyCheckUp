<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MyCheckUp – Responsive Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="user_dashboard.css" />
    <script src="user_dashboard.js" defer></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar" aria-label="Top navigation">
      <button
        class="hamburger"
        id="openDrawer"
        aria-label="Open menu"
        aria-haspopup="true"
        aria-controls="drawer"
        aria-expanded="false"
      >
        ☰
      </button>
      <div class="brand">MyCheckUp</div>
      <div class="user">
        <span class="avatar" aria-hidden="true">👤</span>
        <span>Hello <strong id="username">username</strong></span>
      </div>
    </header>

    <!-- Mobile drawer + scrim -->
    <div class="scrim" id="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-label="Navigation drawer" hidden>
      <nav class="sidenav">
        <button class="nav-item active">Appointments</button>
        <button class="nav-item">Search Practitioners</button>
        <button class="nav-item">Account Details</button>
        <button class="logout">
          <span aria-hidden="true">↪</span> Log Out
        </button>
      </nav>
    </aside>

    <!-- Main layout (desktop sidebar + content) -->
    <main class="layout">
      <aside class="sidenav" aria-label="Sidebar navigation">
        <button class="nav-item active">Appointments</button>
        <button class="nav-item">Search Practitioners</button>
        <button class="nav-item">Account Details</button>
        <button class="logout">
          <span aria-hidden="true">↪</span> Log Out
        </button>
      </aside>

      <section class="content" aria-label="Content">
        <div class="action-tiles" role="group" aria-label="Appointment actions">
          <button id="tileSchedule" class="tile">
            <span class="tile-icon" aria-hidden="true">📅➕</span>
            <span class="tile-title">Schedule New<br />Appointment</span>
          </button>
          <button id="tileCancel" class="tile">
            <span class="tile-icon" aria-hidden="true">❌</span>
            <span class="tile-title">Cancel<br />Appointment</span>
          </button>
          <button id="tileChange" class="tile">
            <span class="tile-icon" aria-hidden="true">🛠️</span>
            <span class="tile-title">Change Current<br />Appointment</span>
          </button>
        </div>

        <h2>Upcoming Appointments</h2>
        <div
          id="appointments"
          class="cards"
          role="list"
          aria-live="polite"
        ></div>

        <!-- Dialog -->
        <dialog id="scheduleDialog">
          <form id="scheduleForm" method="dialog">
            <h3 id="dialogTitle">Schedule Appointment</h3>

            <label
              >Provider
              <select id="providerSelect" required>
                <option>Dr. Jane Doe, MD</option>
                <option>Dr. Jon Doe, MD</option>
              </select>
            </label>

            <label
              >Visit Type
              <select id="visitType" required>
                <option>In-person</option>
                <option>Call</option
              </select>
            </label>

            <label
              >Date
              <input id="dateInput" type="date" required />
            </label>

            <label
              >Time Slot
              <select id="slotSelect" required>
                <option value="">Choose a date first</option>
              </select>
            </label>

            <label
              >Notes
              <textarea id="notes" rows="2" placeholder="Optional"></textarea>
            </label>

            <menu>
              <button value="cancel">Close</button>
              <button class="primary" id="submitSchedule" value="default">
                Save
              </button>
            </menu>
          </form>
        </dialog>
      </section>
    </main>
</body>
</html>
