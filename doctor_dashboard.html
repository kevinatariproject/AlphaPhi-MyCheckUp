<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyCheckUp UI</title>
    <link rel="stylesheet" href="doctor_dashboard.css" />
    <script src="doctor_dashboard.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="chrome-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="spacer"></div>
      <div class="user-pill">
        <span class="icon">👤</span>
        <span>| Hello <em id="username">username</em></span>
      </div>
    </header>

    <main class="shell">
      <aside class="sidebar">
        <div class="brand">MyCheckUp</div>

        <nav class="nav">
          <button class="nav-item active" data-view="dashboard">Appointments</button>
          <button class="nav-item" data-view="schedule">View Schedule</button>
          <button class="nav-item" data-view="availability">Account Details</button>
        </nav>

        <button id="logout" class="logout">
          <span class="logout-icon">↪</span>
          <span>Log Out</span>
        </button>
      </aside>

      <section class="content">
        <!-- Dashboard -->
        <section id="view-dashboard" class="view visible" aria-label="Dashboard">
          <h2>Upcoming Appointments</h2>
          <div id="appt-list" class="appt-list"></div>
        </section>

        <!-- Admin View: Doctor Schedule -->
        <section id="view-schedule" class="view" aria-label="Doctor Schedule Admin">
          <div class="toolbar">
            <h2>Appointment Schedule for <em id="doctorName">DoctorName</em></h2>
            <div class="search">
              <span class="search-icon">🔍</span>
              <input id="doctorSearch" type="search" placeholder="Doctor Name" />
            </div>
            <button class="btn back" data-view="dashboard">Back</button>
          </div>
          <div class="cal-controls">
            <button id="prevMonth1" class="btn icon">◀</button>
            <button id="nextMonth1" class="btn icon">▶</button>
            <div id="monthLabel1" class="month-label"></div>
          </div>
          <div id="calendarAdmin" class="calendar"></div>
        </section>

        <!-- Availability -->
        <section id="view-availability" class="view" aria-label="Availability">
          <div class="toolbar">
            <h2>Availability</h2>
            <button class="btn back" data-view="dashboard">Back</button>
          </div>
          <div class="cal-controls">
            <article class="card">
          <h3>Account Information</h3>
          <div class="section grid two">
            <div class="row">
              <div class="label">User :</div>
              <div class="value">username</div>
            </div>
            <div class="row">
              <div class="label">Password :</div>
              <div class="value">password</div>
            </div>
            <div class="row">
              <div class="label">Last Login :</div>
              <div class="value">MM / DD / YEAR</div>
            </div>
          </div>
        </article>

        <article class="card section">
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
