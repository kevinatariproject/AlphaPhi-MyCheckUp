<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyCheckUp – Doctor Dashboard</title>
    <link rel="stylesheet" href="./css/doctor_dashboard.css" />
    <script src="./scripts/doctor_dashboard.js" defer></script>
  </head>
  <body>
    <!-- Top pseudo browser bar -->
    <header class="topbar">
      <div class="chrome-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="spacer"></div>
      <div class="user-pill">
        <span class="icon">👤</span>
        <span>| Hello <em id="username">username</em></span>
      </div>
    </header>

    <main class="shell">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">Doctor</div>

        <nav class="nav">
          <button class="nav-item active" data-view="dashboard">
            Appointments
          </button>
          <button class="nav-item" data-view="schedule">View Schedule</button>
          <button class="nav-item" data-view="account">Account Details</button>
        </nav>

        <button id="logout" class="logout">
          <span class="logout-icon">↪</span>
          <span>Log Out</span>
        </button>
      </aside>

      <!-- Main content -->
      <section class="content">
        <!-- Upcoming Appointments -->
        <section
          id="view-dashboard"
          class="view visible"
          aria-label="Upcoming Appointments"
        >
          <h2>Upcoming Appointments</h2>
          <div id="appt-list" class="appt-list"></div>
        </section>

        <!-- Availability / View Schedule -->
        <section id="view-schedule" class="view" aria-label="Availability">
          <div class="toolbar">
            <h2>Availability</h2>
            <button class="btn back" data-view="dashboard">Back</button>
          </div>

          <div class="cal-controls">
            <button id="prevMonth" class="btn icon" aria-label="Previous month">
              ◀
            </button>
            <button id="nextMonth" class="btn icon" aria-label="Next month">
              ▶
            </button>
            <div id="monthLabel" class="month-label">October 2025</div>
          </div>

          <div
            id="calendar"
            class="calendar"
            aria-label="Availability calendar"
          ></div>
        </section>

        <!-- Account Details -->
        <section id="view-account" class="view" aria-label="Account Details">
          <h2>Account Details</h2>

          <div class="acct-card">
            <h3>Account Information</h3>
            <div class="row">
              <div class="label">User :</div>
              <div class="value">username</div>
            </div>
            <div class="row">
              <div class="label">Password :</div>
              <div class="value">password</div>
            </div>
            <div class="row">
              <div class="label">Last Login :</div>
              <div class="value">MM / DD / YEAR</div>
            </div>
          </div>

          <div class="acct-card">
            <h3>Doctor Details</h3>
            <div class="row">
              <div class="label">Name :</div>
              <div class="value">Dr. Jane Doe, MD</div>
            </div>
            <div class="row">
              <div class="label">Specialty :</div>
              <div class="value">Specialty</div>
            </div>
            <div class="row">
              <div class="label">Clinic :</div>
              <div class="value">Location</div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
