<!DOCTYPE html>
<html lang="en">

<head> <!-- Just describes the metainformation, wont actually contribute to the view of the page -->
    <meta charset="UTF-8"> <!--setting the font--> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- setting the container scaling -->
    <title>Login</title> <!-- Setting the title of the page-->
    <link rel="stylesheet" href="./css/practioner_login_page.css"> <!-- css file reference -->
    <link rel="stylesheet" href="./css/global_login_pages.css">
    <script type="module" defer src = "./scripts/login_page.js"></script> <!-- javascript file reference -->
</head>

<body>
    <main id="main-holder">
        <div id="welcome-holder">
            <h1 id="welcome-header">MyCheckUp</h1> <!-- setting most important header for the page-->
            <h2 id="welcome-msg">PRACTIONER LOGIN</h2> <!-- setting most important header for the page-->
        </div>

        <div id="login-holder">
            <div id="login-error-msg-holder">
                <p id="login-error-msg">Invalid username <span id="error-msg-second-line"> and/or or password</span></p>
            </div>

            <form id="login-form"> <!-- defines and labels the input element-->
                <div class="field-holder">
                    <input type="email" name="email" id="email-field" class="login-form-field" placeholder=" " autocomplete="email" required>
                    <label for="email">email</label>
                </div>
                <div class="field-holder">
                    <input type="password" name="password" id="password-field" class="login-form-field" autocomplete="current-password" required>
                    <label for="name">password </label>
                </div>
                <input type="hidden" id="user-type" value="doctors">
                <input type="submit" value="LOGIN" id="login-form-submit">
            </form>
            <div class="custom-divider"></div>
            <a href="doc_signup.html">
                <input type="button" value="NEW USER SIGNUP" id="signup-form-submit">
            </a>
        </div>

    </main>
</body>

</html>
